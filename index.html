<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lockout Lifting</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
        }
        .accent { color: #F97316; }
        h1 {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 16px;
        }
        .tagline {
            font-size: 1.2rem;
            color: #999;
            margin-bottom: 48px;
            max-width: 500px;
        }
        .links { display: flex; flex-direction: column; gap: 12px; }
        a {
            color: #F97316;
            text-decoration: none;
            font-size: 1rem;
            padding: 12px 24px;
            border: 1px solid #333;
            border-radius: 12px;
            transition: border-color 0.2s;
        }
        a:hover { border-color: #F97316; }
        footer {
            position: fixed;
            bottom: 24px;
            color: #444;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <h1>LOCK<span class="accent">OUT</span></h1>
    <p class="tagline">The lifting tracker built for people who actually train.</p>
    <div class="links">
        <a href="https://apps.apple.com/app/id6768751120">Download on the App Store</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="mailto:gymbuddy.lockout@gmail.com">Support</a>
    </div>
    <footer>© 2026 Hassan Bayat</footer>
</body>
</html>
